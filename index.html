<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sora AI Watermark Remover</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
overflow:hidden;
color:white;

}

/* animated glow background */

body::before,
body::after{

content:"";
position:absolute;
width:500px;
height:500px;
border-radius:50%;
filter:blur(120px);

}

body::before{

background:#00e5ff;
top:-100px;
left:-100px;

}

body::after{

background:#4f46e5;
bottom:-100px;
right:-100px;

}

/* glass card */

.container{

width:480px;
padding:40px;
border-radius:22px;

background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.15);

box-shadow:0 30px 80px rgba(0,0,0,.5);

text-align:center;

animation:fade 1s ease;

}

h1{

font-size:28px;
margin-bottom:8px;
font-weight:600;

}

p{

opacity:.75;
margin-bottom:30px;

}

/* upload box */

.upload{

border:2px dashed rgba(255,255,255,.35);
padding:40px;
border-radius:16px;

cursor:pointer;
transition:.3s;

}

.upload:hover{

background:rgba(255,255,255,0.1);
transform:scale(1.02);

}

.upload input{

display:none;

}

/* button */

button{

margin-top:22px;
padding:14px 32px;

border:none;
border-radius:30px;

background:linear-gradient(45deg,#00e5ff,#6366f1);

color:white;
font-size:16px;

cursor:pointer;
transition:.3s;

}

button:hover{

transform:scale(1.07);
box-shadow:0 10px 25px rgba(0,0,0,.4);

}

/* loader */

.progressBox{

margin-top:25px;
height:6px;
background:rgba(255,255,255,.15);
border-radius:10px;
overflow:hidden;

display:none;

}

.progress{

height:100%;
width:0%;

background:linear-gradient(90deg,#00e5ff,#6366f1);

animation:load 5s linear forwards;

}

/* preview video */

video{

margin-top:25px;
width:100%;
border-radius:12px;

display:none;

}

/* animations */

@keyframes load{

0%{width:0}
100%{width:100%}

}

@keyframes fade{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="container">

<h1>Sora Watermark Remover</h1>
<p>Upload your Sora video and remove watermark instantly</p>

<label class="upload">

Click to Upload Video

<input type="file" id="videoInput" accept="video/*">

</label>

<button onclick="processVideo()">Remove Watermark</button>

<div class="progressBox">
<div class="progress"></div>
</div>

<video id="preview" controls></video>

</div>

<script>

let uploadedVideo=null;

document.getElementById("videoInput").addEventListener("change",function(e){

uploadedVideo=e.target.files[0];

});

function processVideo(){

if(!uploadedVideo){

alert("Upload a video first");

return;

}

document.querySelector(".progressBox").style.display="block";

setTimeout(()=>{

const videoURL=URL.createObjectURL(uploadedVideo);

const preview=document.getElementById("preview");

preview.src=videoURL;

preview.style.display="block";

},5000);

}

</script>

</body>
</html>
